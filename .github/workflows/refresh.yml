name: Refresh Florida Surf Watch

on:
  schedule:
    - cron: "17 */3 * * *"   # every 3 hours: rebuild with fresh buoy and hurricane data
    - cron: "41 12 * * 1"    # Mondays: also run the weekly accuracy scorecard
  push:
    branches: [main]         # rebuild whenever the code changes
  workflow_dispatch:         # "Run workflow" button for a manual refresh

permissions:
  contents: write            # only used by the weekly scorecard commit

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Weekly scorecard (grades the forecast against buoys, stations and NWS)
        if: github.event.schedule == '41 12 * * 1' || github.event_name == 'workflow_dispatch'
        continue-on-error: true
        timeout-minutes: 8
        run: node validate.js

      - name: Save the scorecard (weekly)
        if: github.event.schedule == '41 12 * * 1'
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add validation.json
          git diff --staged --quiet || (git commit -m "Weekly forecast scorecard" && git push)

      - name: Pull fresh data from NOAA, NWS and Open-Meteo
        run: node build.js

      - name: Build the page
        run: python3 assemble.py site/index.html

      - name: Publish privately to Cloudflare Pages (behind a Cloudflare Access login)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Add the CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID secrets in Settings > Secrets and variables > Actions"; exit 1
          fi
          npx --yes wrangler@4 pages project create florida-surf-watch --production-branch main >/dev/null 2>&1 || true
          npx --yes wrangler@4 pages deploy site --project-name florida-surf-watch --branch main --commit-dirty=true
